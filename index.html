<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#9a6b12">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>போட்டோ பாதுகாப்புப் பெட்டகம்</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f2ec;--card:#fff;--ink:#1d2733;--mute:#5d6875;--line:#d9d5c9;--brass:#9a6b12;--brass-ink:#fff;--ok:#1f6b45;--err:#a3321f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b22;--card:#1d2731;--ink:#eef0f2;--mute:#9aa6b2;--line:#2f3b47;--brass:#d9a441;--brass-ink:#1a1405;--ok:#5fc08d;--err:#f08a77}}
:root[data-theme="dark"]{--bg:#141b22;--card:#1d2731;--ink:#eef0f2;--mute:#9aa6b2;--line:#2f3b47;--brass:#d9a441;--brass-ink:#1a1405;--ok:#5fc08d;--err:#f08a77}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans Tamil",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;line-height:1.3;margin:8px 0 4px}
p.lead{color:var(--mute);margin:0 0 18px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:1.05rem;margin:0 0 10px}
button,input,select{font:inherit;color:inherit}
.btn{display:block;width:100%;min-height:48px;border-radius:10px;border:1.5px solid var(--brass);background:transparent;color:var(--brass);font-weight:600;cursor:pointer;padding:10px 14px}
.btn.primary{background:var(--brass);color:var(--brass-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
input[type=password]{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);margin-bottom:10px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
label.opt input{margin-top:6px;accent-color:var(--brass)}
label.opt small{display:block;color:var(--mute);line-height:1.45}
#list{display:grid;gap:8px;margin-top:12px}
.item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:6px}
.item img{width:56px;height:56px;object-fit:cover;border-radius:6px;flex:none}
.item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.item button{min-width:40px;min-height:40px;border:1px solid var(--line);background:transparent;border-radius:8px;cursor:pointer}
#msg{min-height:1.6em;margin:10px 0 0;font-weight:600}
#msg.ok{color:var(--ok)}#msg.err{color:var(--err)}
.note{color:var(--mute);font-size:.88rem;margin:10px 0 0}
</style>
</head>
<body>
<main>
<h1>போட்டோ → பாதுகாப்பான PDF</h1>
<p class="lead">எல்லாம் உங்கள் மொபைலிலேயே நடக்கும். போட்டோக்கள் எந்த சர்வருக்கும் அனுப்பப்படாது.</p>

<section>
<h2>1. போட்டோக்களைத் தேர்வு செய்யுங்கள்</h2>
<input id="file" type="file" accept="image/*" multiple hidden>
<button class="btn" id="pick">போட்டோக்களைச் சேர்</button>
<div id="list"></div>
</section>

<section>
<h2>2. பாதுகாப்பு முறை</h2>
<label class="opt"><input type="radio" name="mode" value="pdf" checked><div>பாஸ்வேர்ட் PDF<small>எந்த PDF வியூவரிலும் திறக்கும்; திறக்கும்போது பாஸ்வேர்ட் கேட்கும்.</small></div></label>
<label class="opt"><input type="radio" name="mode" value="aes"><div>AES-256 என்கிரிப்ட் கோப்பு<small>அதிக பாதுகாப்பு. இந்தப் பக்கத்தில் மட்டுமே திறக்க முடியும் (கீழே “மீட்டெடு”).</small></div></label>
<input id="pw" type="password" placeholder="பாஸ்வேர்ட் (குறைந்தது 8 எழுத்துகள்)" autocomplete="new-password">
<input id="pw2" type="password" placeholder="பாஸ்வேர்டை மீண்டும் உள்ளிடவும்" autocomplete="new-password">
<button class="btn primary" id="go" disabled>PDF உருவாக்கி சேமி</button>
<p class="note">பாஸ்வேர்டை மறந்தால் கோப்பை மீட்க முடியாது. அதை எங்காவது பத்திரமாக எழுதி வையுங்கள்.</p>
</section>

<section>
<h2>3. AES கோப்பை மீட்டெடு</h2>
<input id="encfile" type="file" accept=".json,application/json" hidden>
<button class="btn" id="pickenc">என்கிரிப்ட் கோப்பைத் தேர்வு செய்</button>
<p class="note" id="encname"></p>
<input id="pw3" type="password" placeholder="பாஸ்வேர்ட்" autocomplete="current-password">
<button class="btn primary" id="dec" disabled>PDF ஆக மீட்டெடு</button>
</section>

<p id="msg" role="status" aria-live="polite"></p>
</main>

<script>
(function(){
var files=[],encFile=null;
var $=function(i){return document.getElementById(i)};
function say(t,c){var m=$('msg');m.textContent=t;m.className=c||''}
function mode(){return document.querySelector('input[name=mode]:checked').value}

function render(){
  var l=$('list');l.textContent='';
  files.forEach(function(f,i){
    var d=document.createElement('div');d.className='item';
    var im=document.createElement('img');im.src=f.url;im.alt='';
    var s=document.createElement('span');s.textContent=(i+1)+'. '+f.file.name;
    d.appendChild(im);d.appendChild(s);
    [['↑',-1],['↓',1],['✕',0]].forEach(function(a){
      var b=document.createElement('button');b.textContent=a[0];
      b.setAttribute('aria-label',a[1]===0?'நீக்கு':a[1]<0?'மேலே நகர்த்து':'கீழே நகர்த்து');
      b.onclick=function(){
        if(a[1]===0){URL.revokeObjectURL(f.url);files.splice(i,1)}
        else{var j=i+a[1];if(j<0||j>=files.length)return;var t=files[i];files[i]=files[j];files[j]=t}
        render();
      };
      d.appendChild(b);
    });
    l.appendChild(d);
  });
  check();
}
function check(){
  var ok=files.length>0&&$('pw').value.length>=8&&$('pw').value===$('pw2').value;
  $('go').disabled=!ok;
  $('dec').disabled=!(encFile&&$('pw3').value.length>0);
}
['pw','pw2','pw3'].forEach(function(i){$(i).addEventListener('input',check)});

$('pick').onclick=function(){$('file').click()};
$('file').onchange=function(e){
  Array.prototype.forEach.call(e.target.files,function(f){files.push({file:f,url:URL.createObjectURL(f)})});
  e.target.value='';say('');render();
};
$('pickenc').onclick=function(){$('encfile').click()};
$('encfile').onchange=function(e){encFile=e.target.files[0]||null;$('encname').textContent=encFile?encFile.name:'';check()};

function loadJpeg(f){
  return createImageBitmap(f).then(function(bm){
    var max=2200,sc=Math.min(1,max/Math.max(bm.width,bm.height));
    var w=Math.round(bm.width*sc),h=Math.round(bm.height*sc);
    var c=document.createElement('canvas');c.width=w;c.height=h;
    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(bm,0,0,w,h);
    return {data:c.toDataURL('image/jpeg',0.85),w:w,h:h};
  });
}
function buildPdf(pw){
  var J=window.jspdf.jsPDF,doc=null;
  var opts=pw?{encryption:{userPassword:pw,ownerPassword:pw+'#owner',userPermissions:['print']}}:{};
  var seq=Promise.resolve();
  files.forEach(function(f,i){
    seq=seq.then(function(){return loadJpeg(f.file)}).then(function(im){
      var pw_=595,ph=Math.round(im.h*pw_/im.w);
      if(!doc){opts.unit='pt';opts.format=[pw_,ph];doc=new J(opts)}
      else doc.addPage([pw_,ph]);
      doc.addImage(im.data,'JPEG',0,0,pw_,ph);
      say('செயலாக்கம்: '+(i+1)+' / '+files.length);
    });
  });
  return seq.then(function(){return doc.output('arraybuffer')});
}
function b64(buf){var s='',u=new Uint8Array(buf);for(var i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
function unb64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function key(pw,salt,use){
  var enc=new TextEncoder();
  return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']).then(function(k){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,[use]);
  });
}
function aesEnc(buf,pw){
  var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  return key(pw,salt,'encrypt').then(function(k){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,buf)}).then(function(ct){
    return JSON.stringify({app:'photo-pdf-vault',v:1,kdf:'PBKDF2-SHA256-250000',salt:b64(salt),iv:b64(iv),data:b64(ct)});
  });
}
function save(name,data){
  return new Promise(function(res,rej){
    try{
      var blob=new Blob([data],{type:name.slice(-4)==='.pdf'?'application/pdf':'application/json'});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(a.href)},30000);res();
    }catch(e){rej(e)}
  });
}
function fail(e){
  var c=e&&e.code;
  if(c==='declined')say('சேமிப்பு ரத்து செய்யப்பட்டது.','err');
  else if(c==='unavailable')say('இங்கே சேமிக்க முடியவில்லை. இந்தப் பக்கத்தை Claude செயலியில் திறக்கவும்.','err');
  else say('பிழை: '+((e&&e.message)||'தெரியாத பிழை'),'err');
  $('go').disabled=false;check();
}
$('go').onclick=function(){
  var pw=$('pw').value,m=mode();$('go').disabled=true;say('தொடங்குகிறது…');
  buildPdf(m==='pdf'?pw:null).then(function(buf){
    if(m==='pdf')return save('photos-protected.pdf',buf).then(function(){return 'பாஸ்வேர்ட் PDF சேமிக்கப்பட்டது.'});
    say('என்கிரிப்ட் செய்கிறது…');
    return aesEnc(buf,pw).then(function(j){return save('photos-encrypted.json',j)}).then(function(){return 'என்கிரிப்ட் கோப்பு சேமிக்கப்பட்டது.'});
  }).then(function(t){say(t,'ok');check()}).catch(fail);
};
$('dec').onclick=function(){
  $('dec').disabled=true;say('மீட்டெடுக்கிறது…');
  encFile.text().then(function(t){
    var o=JSON.parse(t);
    return key($('pw3').value,unb64(o.salt),'decrypt').then(function(k){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},k,unb64(o.data));
    }).catch(function(){throw {message:'பாஸ்வேர்ட் தவறு அல்லது கோப்பு சேதமடைந்துள்ளது.'}});
  }).then(function(buf){return save('photos-restored.pdf',buf)}).then(function(){say('PDF மீட்டெடுக்கப்பட்டது.','ok');check()}).catch(function(e){fail(e);});
};
check();
})();
</script>
</body>
</html>
